worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only successful, fingerprinted static assets receive immutable caching.
    map "$status:$upstream_addr:$uri" $cache_control {
        default "no-store";
        "~^200::/assets/.+-[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # index.html supplies script-src with the generated inline theme hash.
        # No default-src here: it would override that script policy by intersection.
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        # A boundary prevents API-looking SPA paths from reaching the backend.
        location ~ ^${API_BASE_PATH}(?:/|$) {
            proxy_pass ${API_UPSTREAM};
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_cache off;
        }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
